# Feeds searched for the packages in packages.list.
#
# This file replaces the SDK's own feeds.conf.default, so the upstream feeds
# have to be repeated here -- a package in packages.list is resolved against
# whatever is listed below and nothing else.
#
# The branches match what photonicatWrt itself builds from, so a package
# picked up here is the same revision the vendor would have built.
src-git packages https://github.com/photonicat/rockchip_rk3568_openwrt_packages.git;master
src-git luci https://github.com/photonicat/rockchip_rk3568_openwrt_luci.git;openwrt-25.12
src-git routing https://github.com/photonicat/rockchip_rk3568_openwrt_routing.git;openwrt-25.12

# AmneziaWG. Carries kmod-amneziawg, amneziawg-tools and luci-proto-amneziawg
# at its root, so it works directly as a src-git feed.
src-git awg https://github.com/Slava-Shchipunov/awg-openwrt.git
