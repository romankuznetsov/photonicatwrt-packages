name: build SDK

# Produces photonicatWrt's own SDK and publishes it as a release asset.
#
# This is the slow half, and the reason the other workflow is fast. The SDK
# carries the prebuilt toolchain and kernel headers, so packages compile
# against it in minutes instead of rebuilding a 2h30m tree every time.
#
# Run it only when the vendor firmware changes. A kernel module carries a
# vermagic string that must match the running kernel exactly, so an SDK built
# from one firmware produces kmods that will not load on another.

on:
  workflow_dispatch:
    inputs:
      expect_vermagic:
        description: >-
          kernel config hash the device runs; the build fails fast if it
          does not match, because kmods would then be uninstallable. Empty
          to skip the check. `opkg list-installed kernel` on the device.
        default: dd4287729a6652db5d2990f7ec1072e9
        type: string
      source_ref:
        description: >-
          ref of romankuznetsov/photonicat_openwrt to build from. That tree
          has no meaningful tags, so a commit is the only precise answer.
        default: master
        type: string

permissions:
  contents: write

jobs:
  sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 345

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          # The vendor README targets Ubuntu 20.04 and asks for lib32gcc1 and
          # python2.7, neither of which exists on 24.04.
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools rsync swig unzip zlib1g-dev file wget time

      - name: Check out photonicatWrt
        uses: actions/checkout@v4
        with:
          repository: romankuznetsov/photonicat_openwrt
          ref: ${{ inputs.source_ref }}
          path: src

      - name: Record what we are building
        id: src
        working-directory: src
        run: |
          commit=$(git rev-parse --short=9 HEAD)
          kernel=$(sed -n 's/^LINUX_VERSION-6\.12 = \.\([0-9]*\)/6.12.\1/p' include/kernel-6.12)
          version=$(sed -n 's/^CONFIG_VERSION_NUMBER="\(.*\)"/\1/p' configs/photonicat2_base_defconfig)
          echo "commit=$commit"   >> "$GITHUB_OUTPUT"
          echo "kernel=$kernel"   >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "photonicatWrt $version, kernel $kernel, commit $commit"
          test -n "$kernel" || { echo "::error::could not read the kernel version"; exit 1; }

      - name: Restore the toolchain
        id: cache
        uses: actions/cache/restore@v4
        with:
          # tools/install and toolchain/install are 1h23m and 23m of the
          # roughly 2h30m this job takes, and they are identical between
          # attempts at the same source commit. Three failed runs rebuilt them
          # from scratch each time before dying further along.
          #
          # Exact key only, no restore-keys: a toolchain restored from a
          # different commit or config could be subtly wrong in ways that
          # surface much later, and a wrong SDK produces kmods that do not
          # load. Better to spend the 1h46m than to debug that.
          path: |
            src/dl
            src/staging_dir
            src/build_dir/toolchain-*
            src/build_dir/host
            src/build_dir/hostpkg
          key: sdk-toolchain-${{ steps.src.outputs.commit }}-${{ hashFiles('src/configs/photonicat2_base_defconfig') }}

      - name: Configure the tree
        working-directory: src
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # v2ray-geodata cannot be built at all, by anyone, and has killed
          # three runs here. Its Makefile pins dated GitHub release assets:
          #
          #   GEOIP_VER=202404040040      geoip.dat -> 200
          #   GEOSITE_VER=20240404120755  dlc.dat   -> 404
          #
          # v2fly/domain-list-community prunes old releases, so that tag is
          # simply gone. It fails in the *download* phase, which is why
          # IGNORE_ERRORS=m never caught it -- that governs building, not
          # fetching -- and why no amount of retrying would have helped.
          #
          # Deleting the config symbols does not work either: make defconfig
          # puts them straight back, because other packages depend on them.
          # Removing it from the feed is what actually stops it, since the
          # symbol then does not exist to be selected.
          #
          # The hash assertion after target/compile is the safety net: if
          # dropping this package or its dependents disturbs the kernel
          # config, the build fails in about half an hour and says so.
          ./scripts/feeds uninstall v2ray-geodata 2>/dev/null || true
          test ! -e package/feeds/packages/v2ray-geodata || \
            { echo "::error::v2ray-geodata is still installed in the feed"; exit 1; }
          echo "v2ray-geodata removed from the feed"
          cp configs/photonicat2_base_defconfig .config

          # Strip ONLY node and v2ray, and nothing else.
          #
          # The kernel config hash is what every kmod package depends on:
          #
          #   Depends: kernel (=6.12.91-1-<hash>)
          #
          # and include/kernel-defaults.mk computes it as
          #
          #   grep '=[ym]' $(LINUX_DIR)/.config.set | LC_ALL=C sort | mkhash md5
          #
          # i.e. an md5 of the kernel's own config. Package selections feed
          # into it only where a package declares KCONFIG, which 44 packages
          # in the base tree do. Stripping all 1373 userspace entries
          # therefore moved the hash to e0a9c3e3..., while the device has
          # dd428772..., and every kmod built here became uninstallable:
          # opkg refuses it, and neither --force-depends nor --nodeps helps
          # because the check happens during resolution.
          #
          # node and v2ray-geodata both declare no KCONFIG (checked), so
          # dropping them cannot change the kernel config -- while saving the
          # 2h29m of host V8 that killed run 37610731481 and the
          # v2ray-geodata failure that killed 37687211159.
          sed -i -E '/^CONFIG_PACKAGE_(node|v2ray)/d' .config

          # CONFIG_SDK defaults to BUILDBOT, i.e. off here. target/Makefile
          # hangs sdk/install off linux/install, so the kernel is built either
          # way; this only adds the packaging step at the end.
          echo 'CONFIG_SDK=y' >> .config
          make defconfig
          grep -q '^CONFIG_SDK=y' .config || { echo "::error::defconfig dropped CONFIG_SDK"; exit 1; }
          echo "packages still selected after stripping: $(grep -c '^CONFIG_PACKAGE_.*=[ym]' .config)"
          echo "  of which kmods: $(grep -c '^CONFIG_PACKAGE_kmod-.*=[ym]' .config)"

          # The crypto libraries kmod-amneziawg links against. Checked here
          # rather than discovered two hours later in a feed build.
          for k in kmod-crypto-lib-chacha20poly1305 kmod-crypto-lib-curve25519 \
                   kmod-udptunnel4 kmod-udptunnel6; do
            grep -q "^CONFIG_PACKAGE_$k=[ym]\$" .config || \
              { echo "::error::$k is not selected; out-of-tree modules will not link"; exit 1; }
          done

          # Guard the thing that actually matters: the SDK is only useful if
          # its kernel matches the device's.
          grep -q "^CONFIG_LINUX_6_12=y" .config || \
            { echo "::error::kernel series is not 6.12 after defconfig"; exit 1; }

      - name: Build the toolchain
        id: toolchain
        working-directory: src
        run: |
          make download -j8
          make -j"$(nproc)" tools/install toolchain/install
          du -sh staging_dir dl build_dir/toolchain-* build_dir/host build_dir/hostpkg 2>/dev/null | sort -h

      - name: Save the toolchain
        # always(), because the point is to survive a failure further along --
        # actions/cache only saves on success, which is exactly backwards for
        # a job whose later steps are the ones being debugged. Skipped on a
        # cache hit, since nothing in it changed.
        if: always() && steps.toolchain.outcome == 'success' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            src/dl
            src/staging_dir
            src/build_dir/toolchain-*
            src/build_dir/host
            src/build_dir/hostpkg
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Build the SDK
        working-directory: src
        run: |
          # IGNORE_ERRORS=m here too. target/compile pulls package builds in
          # with it, and run 37777914498 died inside this phase on
          # v2ray-geodata -- the same package as before, because make
          # defconfig puts it back: the strip left 1762 selections and
          # defconfig returned 1764. Something in the vendor config depends
          # on it.
          #
          # Letting defconfig restore it is correct, in fact. The device's
          # own config selects v2ray too, so keeping it selected is part of
          # matching the kernel config hash; it simply must not be allowed to
          # abort the build when it fails to compile.
          make -j"$(nproc)" IGNORE_ERRORS=m target/compile

          # Assert the kernel config hash NOW, ~30 minutes in, rather than
          # discovering after hours of packaging that every kmod is
          # uninstallable. .vermagic is written during Kernel/Configure, so
          # it is already final at this point.
          vm=$(cat build_dir/target-*/linux-*/.vermagic 2>/dev/null)
          echo "kernel config hash: $vm"
          want="${{ inputs.expect_vermagic }}"
          if [ -n "$want" ] && [ "$vm" != "$want" ]; then
            echo "::error::kernel config hash is $vm, expected $want"
            echo "kmods built here would carry Depends: kernel (=${{ steps.src.outputs.kernel }}-1-$vm)"
            echo "and the device would refuse them. The .config differs from the vendor's."
            exit 1
          fi

          # target/linux/install builds device images, and an image needs a
          # rootfs that only package/install produces. Skipping these two was
          # what killed run 37703634406:
          #
          #   tar: .../build_dir/target-aarch64_generic_musl/root-rockchip/:
          #        Cannot open: No such file or directory
          #
          # With the package list stripped to 240 these are cheap, where the
          # vendor's full 1776 is what made the first attempt fail on an
          # unrelated package.
          # IGNORE_ERRORS=m lets a failing '=m' package be skipped rather
          # than abort the run. With the vendor's full selection restored
          # this phase attempts ~1760 packages, and losing all of it to one
          # flaky optional package -- which is exactly how run 37687211159
          # ended, on v2ray-geodata -- is not a good trade. Packages that are
          # '=y', i.e. actually in the image, still fail the build.
          make -j"$(nproc)" IGNORE_ERRORS=m package/compile
          make -j"$(nproc)" IGNORE_ERRORS=m package/install

          # OpenWrt reports 'ERROR: target/linux failed to build' and nothing
          # else, which cost a 2h29m run to diagnose. Retry once verbosely so
          # the real error is in the log rather than in the next run.
          make -j"$(nproc)" IGNORE_ERRORS=m target/linux/install || {
            echo "::warning::target/linux/install failed; re-running verbosely"
            make -j1 V=s target/linux/install
          }
          make -j"$(nproc)" IGNORE_ERRORS=m target/sdk/install

      - name: Locate the tarball
        id: find
        working-directory: src
        run: |
          # NOT 'openwrt-sdk-*'. target/sdk/Makefile builds
          # $(VERSION_DIST_SANITIZED)-sdk-..., and CONFIG_VERSION_DIST here is
          # "photonicatWrt", so the file is photonicatwrt-sdk-*.tar.xz.
          # Matching the upstream name cost run 37716104046: the build
          # succeeded after 2h47m and then failed to find its own output.
          f=$(find bin -name '*-sdk-*.tar.*' | head -1)
          if [ -z "$f" ]; then
            echo "::error::no SDK tarball produced"
            echo "contents of bin/, so the next failure needs no second run:"
            find bin -maxdepth 4 -type f | head -40
            exit 1
          fi
          echo "path=$PWD/$f" >> "$GITHUB_OUTPUT"
          ls -lh "$f"

      - name: Keep the tarball as an artifact
        # Insurance. Run 37746082206 built the SDK in 1h52m and then threw it
        # away because the publish step hit an existing tag -- the runner is
        # destroyed with the file on it. An artifact survives a failure in
        # the step after this one, so the build can be salvaged by hand
        # rather than repeated.
        if: always() && steps.find.outputs.path != ''
        uses: actions/upload-artifact@v4
        with:
          name: sdk-tarball
          path: ${{ steps.find.outputs.path }}
          retention-days: 7
          if-no-files-found: warn

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: src
        run: |
          tag="sdk-${{ steps.src.outputs.version }}-k${{ steps.src.outputs.kernel }}-${{ steps.src.outputs.commit }}"
          # The tag carries the kernel version because that is what decides
          # whether the kmods built from this SDK will load, and the source
          # commit because "26.04.1" does not identify a tree -- that repo
          # publishes images, not tagged source.
          cat > /tmp/notes.md <<NOTES
          photonicatWrt ${{ steps.src.outputs.version }}, kernel ${{ steps.src.outputs.kernel }}

          Built from romankuznetsov/photonicat_openwrt@${{ steps.src.outputs.commit }}.
          That tree publishes images rather than tagged source, so the commit
          is the only precise identifier for what went into this SDK.

          Packages built against this SDK load only on a device running kernel
          ${{ steps.src.outputs.kernel }} -- a kernel module carries a vermagic
          string that must match exactly. Check \`uname -r\` first.
          NOTES
          sed -i 's/^          //' /tmp/notes.md

          title="SDK photonicatWrt ${{ steps.src.outputs.version }} / kernel ${{ steps.src.outputs.kernel }}"

          # The tag is version + kernel + source commit, so rebuilding from
          # the same source deliberately produces the same tag -- and the
          # rebuild is usually the better artifact, as when run 37746082206
          # added the 400 kmods the first SDK was missing. gh release create
          # refuses an existing tag outright, so replace the asset instead of
          # failing after a two-hour build.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $tag exists; replacing its asset"
            gh release upload "$tag" "${{ steps.find.outputs.path }}" \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "$title" --notes-file /tmp/notes.md
          else
            gh release create "$tag" "${{ steps.find.outputs.path }}" \
              --repo "$GITHUB_REPOSITORY" --title "$title" --notes-file /tmp/notes.md
          fi
          echo "released $tag"
